openapi: "3.1.0"
info:
  title: "roombook API"
  description: "회의실 예약 BC 의 계약. docs/prd.md 에서 도출한 초안이고 경로와 거절 코드 이름은 spec 단계에서 확정한다."
  version: "0.1"
tags:
  - name: "rooms"
    description: "회의실 조회"
  - name: "reservations"
    description: "예약 현황 조회, 예약 생성, 예약 취소"
paths:
  /api/rooms:
    get:
      operationId: listRooms
      summary: "회의실 목록 조회"
      description: "초기 데이터로 넣은 회의실 전부를 이름, 층, 수용 인원과 함께 돌려준다."
      tags: ["rooms"]
      responses:
        "200":
          description: "회의실 목록"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /api/rooms/{roomId}/reservations:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listReservations
      summary: "날짜별 예약 현황 조회"
      description: "회의실 하나와 날짜 하나의 예약을 시작 시각순으로 돌려준다. 예약이 없으면 빈 배열이다. 회의실이 없으면 404 로 실패한다."
      tags: ["reservations"]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - name: date
          in: query
          required: true
          description: "조회할 날짜(YYYY-MM-DD)"
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "그날의 예약 목록(시간순)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "400":
          description: "date 가 없거나 날짜 형식이 아니다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "404":
          description: "회의실이 없다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
    post:
      operationId: createReservation
      summary: "예약 생성"
      description: "회의실에 예약을 만든다. 업무 규칙(겹침, 30분 단위, 길이, 시간대, 예약 가능 기간, 참석 인원, 제목)에 걸리면 걸린 규칙을 식별하는 코드와 함께 거절한다. 겹치는 요청이 동시에 들어오면 하나만 성공한다."
      tags: ["reservations"]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: "만든 예약"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: "입력 꼴이 틀렸거나 X-Employee-Id 헤더가 없다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "404":
          description: "회의실이 없다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "409":
          description: "같은 회의실의 기존 예약과 시간이 겹친다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "422":
          description: "겹침 밖의 업무 규칙에 걸렸다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
  /api/reservations/{reservationId}/cancel:
    post:
      operationId: cancelReservation
      summary: "예약 취소"
      description: "자기 예약을 취소 상태로 바꾼다. 예약은 지워지지 않는다. 예약한 본인이 아니거나 시작 30분 전이 지났으면 거절한다."
      tags: ["reservations"]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - name: reservationId
          in: path
          required: true
          description: "취소할 예약의 id"
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "취소 상태가 된 예약"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: "X-Employee-Id 헤더가 없다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "403":
          description: "예약한 본인이 아니다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "404":
          description: "예약이 없다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
        "422":
          description: "시작 30분 전이 지났거나 이미 취소된 예약이다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rejection"
components:
  parameters:
    EmployeeId:
      name: X-Employee-Id
      in: header
      required: true
      description: "직원 식별자. 사내 게이트웨이가 넣어 준다."
      schema:
        type: string
    RoomId:
      name: roomId
      in: path
      required: true
      description: "회의실 id"
      schema:
        type: integer
        format: int64
  schemas:
    Room:
      type: object
      required: [id, name, floor, capacity]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        floor:
          type: integer
        capacity:
          type: integer
          description: "수용 인원"
    Reservation:
      type: object
      required: [id, roomId, date, startTime, endTime, title, attendeeCount, reservedBy, status, mine, cancellable]
      properties:
        id:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        startTime:
          type: string
          description: "HH:mm"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
        endTime:
          type: string
          description: "HH:mm"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
        title:
          type: string
          maxLength: 50
        attendeeCount:
          type: integer
          minimum: 1
        reservedBy:
          type: string
          description: "예약자의 직원 식별자"
        status:
          type: string
          enum: ["RESERVED", "CANCELLED"]
        mine:
          type: boolean
          description: "요청자가 예약한 본인인가(취소 버튼 표시용)"
        cancellable:
          type: boolean
          description: "요청자가 지금 취소할 수 있는가(시작 30분 전이 지나지 않았다)"
    CreateReservationRequest:
      type: object
      required: [date, startTime, endTime, title, attendeeCount]
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          description: "HH:mm"
        endTime:
          type: string
          description: "HH:mm"
        title:
          type: string
        attendeeCount:
          type: integer
    Rejection:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "걸린 규칙을 식별하는 코드"
          enum:
            - "OVERLAP"
            - "INVALID_SLOT"
            - "INVALID_DURATION"
            - "OUT_OF_HOURS"
            - "OUT_OF_WINDOW"
            - "INVALID_ATTENDEES"
            - "INVALID_TITLE"
            - "NOT_OWNER"
            - "CANCEL_TOO_LATE"
            - "ALREADY_CANCELLED"
            - "ROOM_NOT_FOUND"
            - "RESERVATION_NOT_FOUND"
            - "INVALID_REQUEST"
        message:
          type: string
          description: "사람이 읽는 설명"
